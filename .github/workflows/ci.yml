# Re runs every test and lint check in a clean environment on every push and
# pull request. This is what proves a feature works, rather than "works on my
# machine", per ENGINEERING_STANDARDS.md section 3 step 6.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend, tests and lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tiemeghana
          POSTGRES_USER: tiemeghana
          POSTGRES_PASSWORD: tiemeghana
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI runs against PostgreSQL, not the SQLite dev fallback, so a migration
      # or query that only works on SQLite is caught here and not in the demo.
      DATABASE_URL: postgres://tiemeghana:tiemeghana@localhost:5432/tiemeghana
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "0"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting with Black
        run: black --check .

      - name: Check import order with isort
        run: isort --check-only .

      - name: Lint with Ruff
        run: ruff check .

      - name: Verify no missing migrations
        # A model changed without a matching migration passes locally against
        # an existing database and then fails on a fresh deploy. Catch it here.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest --cov=. --cov-report=term-missing

  frontend:
    name: Frontend, tests and lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify production build
        run: npm run build
