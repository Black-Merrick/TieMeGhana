<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The app mark, derived from public/icon.png by tools/build_icons.py.

      Sized per use rather than pointed at the one file. The source is around
      250 kB, which is the right size for a home screen icon and the wrong size
      for a browser tab: every visit would pull a quarter of a megabyte to draw
      something sixteen pixels across.
    -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3d2e" />
    <meta
      name="description"
      content="Hospital communication for Deaf and Hard of Hearing patients in Ghana."
    />
    <title>Tie Me Ghana</title>

    <!--
      The splash, inline and in the document rather than in the bundle.

      It has to be painted before any JavaScript is parsed, which is the whole
      point: on a hospital connection the gap between the page arriving and
      React mounting is the longest blank moment the app has, and a blank
      screen is what makes a patient hand the device back. Inline styles and an
      inline mark mean it needs no second request to appear.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #0a4a3a;
        transition: opacity 260ms ease;
      }

      #splash[data-leaving="true"] {
        opacity: 0;
        pointer-events: none;
      }

      .splash__inner {
        display: grid;
        justify-items: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }

      .splash__mark {
        width: 5.5rem;
        height: 5.5rem;
        border-radius: 1.1rem;
        display: block;
        box-shadow: 0 10px 30px rgba(11, 61, 46, 0.18);
      }

      .splash__name {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      .splash__sub {
        margin: -0.6rem 0 0;
        font-size: 0.85rem;
        color: #5d6f68;
        max-width: 18rem;
      }

      /* A bar that fills rather than a spinner. A spinner says only "wait"; a
         bar that moves says the app is getting somewhere, which is what
         someone deciding whether it is broken needs to see. */
      .splash__track {
        width: 11rem;
        height: 0.3rem;
        border-radius: 999px;
        background: #e6ebef;
        overflow: hidden;
      }

      .splash__bar {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #0a4a3a;
        animation: splash-slide 1.1s ease-in-out infinite;
      }

      @keyframes splash-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      /* Still a bar, just not a moving one, so the cue degrades rather than
         disappearing. */
      @media (prefers-reduced-motion: reduce) {
        .splash__bar {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
