server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The service worker must never be served from cache, otherwise a device
    # keeps running an old build and a fix appears not to have deployed.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GhSL clips, cached hard because a given clip file never changes once
    # reviewed. A corrected sign is published under a new filename.
    location /media/ {
        proxy_pass http://backend:8000/media/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback, so a deep link or a QR code target resolves to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
